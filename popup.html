<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>B站兴趣画像与推荐控制</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>🎯 推荐算法控制</h2>
  
  <!-- 一键清除信息茧房 -->
  <div class="control-section">
    <button id="clear-bubble-btn" class="clear-bubble-btn">
      🚀 一键清除信息茧房
    </button>
    <p class="tip">点击此按钮将随机化推荐算法，破除信息茧房</p>
  </div>
  
  <h3>📊 当前兴趣画像</h3>
  <button id="refresh-profile-btn">获取当前画像</button>
  <div id="current-profile"></div>
  
  <h3>📅 历史画像切换</h3>
  <p class="tip">点击"应用此推荐"可直接切换到该时期的推荐状态</p>
  <ul id="history-list"></ul>
  
  <h3>💡 推荐内容</h3>
  <div id="recommend"></div>
  
  <!-- 加载状态 -->
  <div id="loading" class="loading-overlay" style="display: none;">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div id="progress-bar-container" style="width: 80%; height: 8px; background: #eee; border-radius: 4px; margin: 16px auto 8px auto;">
        <div id="progress-bar" style="width: 0; height: 100%; background: #409eff; border-radius: 4px; transition: width 0.3s;"></div>
      </div>
      <p id="progress-text">正在更改推荐算法...</p>
      <p class="loading-tips">请勿关闭此窗口，操作可能需要几分钟</p>
    </div>
  </div>
  
  <!-- 成功消息 -->
  <div id="success-message" class="success-message" style="display: none;"></div>
  
  <script src="popup.js"></script>
</body>
</html>
