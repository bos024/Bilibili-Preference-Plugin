<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>测试页面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .apply-btn {
      background: #4CAF50;
      color: white;
    }
    .preview-btn {
      background: #2196F3;
      color: white;
    }
  </style>
</head>
<body>
  <h1>按钮功能测试</h1>
  
  <div class="test-section">
    <h3>测试预设推荐算法按钮</h3>
    <div>
      <span>科技</span>
      <button class="apply-btn" data-action="apply" data-name="科技" data-profile='{"sectionCount":{"科技":15,"数码":12},"upCount":{"科技UP主1":8}}'>
        🎯 应用
      </button>
      <button class="preview-btn" data-action="preview" data-profile='{"sectionCount":{"科技":15,"数码":12},"upCount":{"科技UP主1":8}}'>
        👁️ 预览
      </button>
    </div>
  </div>
  
  <div class="test-section">
    <h3>测试随机推荐算法按钮</h3>
    <div>
      <span>随机</span>
      <button class="apply-btn" data-action="apply" data-name="随机" data-random="true">
        🎯 应用
      </button>
      <button class="preview-btn" data-action="preview" data-random="true">
        👁️ 预览
      </button>
    </div>
  </div>
  
  <div id="result"></div>
  
  <script>
    // 模拟popup.js中的函数
    function applyRecommendation(name, profile) {
      document.getElementById('result').innerHTML = `
        <div style="color: green; margin-top: 20px;">
          <h4>应用推荐算法成功！</h4>
          <p>名称: ${name}</p>
          <p>Profile: ${JSON.stringify(profile, null, 2)}</p>
        </div>
      `;
    }
    
    function previewProfile(profile) {
      document.getElementById('result').innerHTML = `
        <div style="color: blue; margin-top: 20px;">
          <h4>预览推荐算法成功！</h4>
          <p>Profile: ${JSON.stringify(profile, null, 2)}</p>
        </div>
      `;
    }
    
    function generateRandomProfile() {
      return {
        sectionCount: {
          '科技': Math.floor(Math.random() * 10) + 1,
          '生活': Math.floor(Math.random() * 10) + 1,
          '历史': Math.floor(Math.random() * 10) + 1
        },
        upCount: {
          '随机UP主1': Math.floor(Math.random() * 5) + 1,
          '随机UP主2': Math.floor(Math.random() * 5) + 1
        }
      };
    }
    
    // 事件委托处理按钮点击
    function handleButtonClick(event) {
      const target = event.target;
      
      if (target.classList.contains('apply-btn') || target.classList.contains('preview-btn')) {
        const action = target.getAttribute('data-action');
        const name = target.getAttribute('data-name') || '未知';
        const profileData = target.getAttribute('data-profile');
        const isRandom = target.getAttribute('data-random') === 'true';
        
        let profile;
        if (isRandom) {
          profile = generateRandomProfile();
        } else if (profileData) {
          try {
            profile = JSON.parse(profileData);
          } catch (error) {
            console.error('解析profile数据失败:', error);
            return;
          }
        }
        
        if (action === 'apply' && profile) {
          applyRecommendation(name, profile);
        } else if (action === 'preview' && profile) {
          previewProfile(profile);
        }
      }
    }
    
    // 添加事件委托监听器
    document.addEventListener('click', handleButtonClick);
  </script>
</body>
</html>
